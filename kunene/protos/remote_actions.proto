syntax = "proto3";

package kunene;

service KuneneRemote {
  rpc RunAction (ActionRequest) returns (ActionResponse) {}
  rpc GetAvailableActions (Empty) returns (AvailableActionsResponse) {}
  // Poll the progress of a running job (status.json of its work directory).
  // The job_id is chosen by the client and sent in ActionRequest, so a
  // second channel can poll while the unary RunAction call blocks.
  rpc GetProgress (ProgressRequest) returns (ProgressResponse) {}
}

message ProgressRequest {
  string job_id = 1;
}

message ProgressResponse {
  bool found = 1;            // false: unknown job or no status written yet
  bytes status_json = 2;     // raw contents of the job's status.json
}

message Empty {}

message ActionInfo {
  string name = 1;
  string description = 2;
}

message AvailableActionsResponse {
  repeated ActionInfo actions = 1;
}

message File {
  string name = 1;
  bytes content = 2;
}

message ActionRequest {
  string action_name = 1;
  // Restricted JSON (see kunene/serialization.py), not pickle.
  // Field name kept for wire compatibility with the generated pb2 modules.
  bytes pickled_val_dict = 3;
  repeated File input_files = 4;
  repeated string output_patterns = 5;
  string target_action_name = 6; // name of action already on server
  string job_id = 7;             // client-chosen id for GetProgress polling
}

message ActionResponse {
  bool success = 1;
  string error_message = 2;
  // The result dictionary as restricted JSON (see kunene/serialization.py).
  bytes pickled_results = 3;
  repeated File output_files = 4;
}
